name: Build and Deploy Blazor to Plesk (Staging)

on:
  push:
    branches: [ "qa" ]
  workflow_dispatch: {}

env:
  PUBLISH_DIR: ./publish
  DOTNET_VERSION: 10.0.x
  SQLITE_DB_NAME: hackerspace-staging.db

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Create appsettings.Production.json
        run: |
          cat <<EOF > Server/appsettings.Production.json
          {
            "ConnectionStrings": {
              "DefaultConnection": "Data Source=../.data/$SQLITE_DB_NAME"
            },
            "Admin": {
              "Email": "${{ secrets.ADMIN_EMAIL }}",
              "Password": "${{ secrets.ADMIN_PASSWORD }}"
            },
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*"
          }
          EOF

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish self-contained(win-x64 example)
        run: |
          dotnet publish Server/Server.csproj \
              --configuration Release \
              --runtime win-x64 \
              --self-contained true \
              /p:PublishTrimmed=false \
              --output ${{ env.PUBLISH_DIR }}

      # Optional: show what got published (for debugging)
      - name: List published files
        run: ls -R ${{ env.PUBLISH_DIR }}

      - name: Deploy via FTP to Plesk
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ${{ env.PUBLISH_DIR }}/
          server-dir: ${{ secrets.STAGING_FTP_REMOTE_DIR }}/
          exclude: |
            data/**
          # optional safety flags:
          dangerous-clean-slate: false
